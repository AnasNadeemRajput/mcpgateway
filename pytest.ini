[pytest]
# ============================================================================
# Test Discovery
# ============================================================================

# Files to discover
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Ignore these directories
norecursedirs = .git .venv venv __pycache__ .pytest_cache

# ============================================================================
# Async Support
# ============================================================================

asyncio_mode = auto

asyncio_default_fixture_loop_scope = session
# ============================================================================
# Markers
# ============================================================================

markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (requires database)
    slow: Slow tests (skip in CI if needed)
    asyncio: Async tests
    smoke: Smoke tests (critical functionality)

# ============================================================================
# Warnings
# ============================================================================

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::RuntimeWarning
    error::UserWarning

# ============================================================================
# Default Options
# ============================================================================

addopts =
    -ra
    --strict-markers
    --tb=short
    --maxfail=5
    --capture=no
    --showlocals
    -l

# ============================================================================
# Logging
# ============================================================================

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# ============================================================================
# Coverage
# ============================================================================

# Coverage settings (when using pytest-cov)
# These are defaults - can be overridden by command line

# Minimum coverage percentage
# COVERAGE_THRESHOLD = 80

# Files to include in coverage report
# addopts =
#     --cov=.
#     --cov-report=term-missing
#     --cov-report=html
#     --cov-branch
#     --cov-fail-under=80

# ============================================================================
# Timeouts
# ============================================================================

# Default timeout in seconds (when using pytest-timeout)
timeout = 300
timeout_method = thread